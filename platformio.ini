[env:waveshare_esp32_s3_zero]
platform = espressif32
board = waveshare_esp32_s3_zero
framework = arduino
monitor_speed = 115200
lib_ldf_mode = chain+
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags = 
    -DARDUINO_USB_MODE=0
    -I "$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src"
